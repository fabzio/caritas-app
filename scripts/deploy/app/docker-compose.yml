services:
  caritas-api:
    image: ${API_IMAGE:-ghcr.io/fabzio/caritas-api:latest}
    container_name: caritas-api
    env_file:
      - ./api.env
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=8000
      - VIRTUAL_PATH=/api
  caritas-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/fabzio/caritas-frontend:latest}
    container_name: caritas-frontend
    env_file:
      - ./frontend.env
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=80
      - VIRTUAL_PATH=/

networks:
  default:
    name: nginx-proxy
    external: true
