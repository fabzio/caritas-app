name: Deploy dev application packages

on:
  push:
    branches:
      - develop

permissions:
  packages: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      api: ${{ steps.changes.outputs.api }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        run: bun run test

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  build-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun ci
        working-directory: ./apps/api

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker API image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/caritas-api:dev  -f ./apps/api/Dockerfile .

      - name: Push Docker API image :dev
        run: docker push ghcr.io/${{ github.repository_owner }}/caritas-api:dev
  build-frontend:
    needs: [changes, test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun ci
        working-directory: ./apps/frontend

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/caritas-frontend:dev \
            --build-arg VITE_API_URL=${{ vars.DEV_HOST }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.CLOUDFLARE_TURNSTILE_SITE_KEY }} \
            -f ./apps/frontend/Dockerfile \
            .

      - name: Push Docker Frontend image :dev
        run: docker push ghcr.io/${{ github.repository_owner }}/caritas-frontend:dev
