name: Ejecutar pruebas en feature y hotfix

on:
  push:
    branches:
      - "feature/*"
      - "hotfix/*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Instalar dependencias
        run: bun ci
      - name: Ejecutar tests
        run: bun run test
