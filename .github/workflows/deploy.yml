name: Deploy application packages

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        run: bun run test
  build-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun ci
        working-directory: ./apps/api

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker API image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/caritas-api:latest -f ./apps/api/Dockerfile .

      - name: Push Docker API image
        run: docker push ghcr.io/${{ github.repository_owner }}/caritas-api:latest

  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun ci
        working-directory: ./apps/frontend

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/caritas-frontend:latest \
            --build-arg VITE_API_URL=${{ vars.HOST }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.CLOUDFLARE_TURNSTILE_SITE_KEY }} \
            -f ./apps/frontend/Dockerfile \
            .

      - name: Push Docker Frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/caritas-frontend:latest
