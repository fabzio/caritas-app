# must be unique in a given SonarQube Server instance
sonar.projectKey=Caritas
sonar.exclusions=**/packages/**
sonar.coverage.exclusions=**/packages/**
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info,apps/api/coverage/lcov.info
# --- optional properties ---

# defaults to project key
#sonar.projectName=My project
# defaults to 'not provided'
#sonar.projectVersion=1.0
 
# Path is relative to the sonar-project.properties file. Defaults to .
#sonar.sources=.
 
# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8