services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: caritas_postgres_dev
    env_file:
      - .env.development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caritas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-caritasdb} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Valkey (Redis OSS fork)
  valkey:
    image: valkey/valkey:latest
    container_name: caritas_valkey_dev
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --save
      - "60"
      - "1"
      - --appendonly
      - yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - caritas_network
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "${VALKEY_PASSWORD}" ]; then redis-cli -a "${VALKEY_PASSWORD}" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API Backend Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: caritas_api_dev
    env_file:
      - .env.development
    networks:
      - caritas_network
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: caritas_frontend_dev
    networks:
      - caritas_network
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
  reverse-proxy:
    image: traefik:v3.5
    container_name: caritas_reverse_proxy_dev
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - caritas_network

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local

networks:
  caritas_network:
